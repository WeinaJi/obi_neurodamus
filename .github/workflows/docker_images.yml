name: Docker image

on:
  workflow_dispatch:
    inputs:
      NEURODAMUS_TAG:
        description: 'neurodamus tag to use'
        required: false
        default: 'main'
      NEURON_TAG:
        description: 'NEURON tag to use'
        required: false
        default: 'master'
      LIBSONATAREPORT_TAG:
        description: 'libsonatareport tag to use'
        required: false
        default: 'master'
      LIBSONATA_TAG:
        description: 'libsonata tag to use'
        required: false
        default: 'master'

env:
  REGISTRY_IMAGE: weinaji/neurodamus_${{ inputs.NEURODAMUS_TAG }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: dockerhub # to read dockerhub username and password
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{steps.meta.outputs.labels}}
          context: ./docker # important for any COPY/ADD operations in the Dockerfile
          file: ./docker/Dockerfile
          tags: ${{ env.REGISTRY_IMAGE }}
          build-args: |
            NEURODAMUS_TAG=${{ inputs.NEURODAMUS_TAG }}
            NEURON_TAG=${{ inputs.NEURON_TAG }}
            LIBSONATAREPORT_TAG=${{ inputs.LIBSONATAREPORT_TAG }}
            LIBSONATA_TAG=${{ inputs.LIBSONATA_TAG }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # import cache from a previously exported cache with --cache-to
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    environment: dockerhub  # to read dockerhub username and password
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}